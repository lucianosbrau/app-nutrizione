<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>App Nutrizione</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nutrizione">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🥗 App Nutrizione <small id="app-version" style="font-size:.7rem;font-weight:400;opacity:.8"></small></h1>
  </header>

  <main>
    <section id="view-week" class="view">
      <h2 id="week-title"></h2>
      <div id="week-grid"></div>
    </section>

    <section id="view-planner" class="view hidden">
      <h2>Programmazione settimanale</h2>
      <div class="actions">
        <button id="btn-auto">⚡ Compilazione automatica</button>
        <button id="btn-manual">✏️ Compilazione manuale</button>
        <button id="btn-activate">✅ Valida settimana</button>
      </div>
      <p class="hint">Tocca un giorno per scegliere la coppia pranzo+cena da inserire. Tocca un giorno occupato per sostituire o rimuovere la card.</p>
      <div id="planner-grid"></div>
    </section>

    <section id="view-tables" class="view hidden">
      <h2>Tabelle informative</h2>
      <div id="tables-container"></div>
    </section>

    <section id="view-shopping" class="view hidden">
      <h2>Lista della spesa</h2>
      <div class="actions">
        <button id="btn-shopping-build">🛒 Genera da settimana attiva</button>
        <button id="btn-shopping-export">📤 Esporta</button>
      </div>
      <p class="hint">Spunta gli ingredienti che hai già a casa: vengono rimossi dalla lista.</p>
      <ul id="shopping-list"></ul>
    </section>
  </main>

  <nav id="bottom-nav">
    <button data-view="week" class="active">📅<br>Settimana</button>
    <button data-view="planner">🗓️<br>Programma</button>
    <button data-view="tables">📋<br>Tabelle</button>
    <button data-view="shopping">🛒<br>Spesa</button>
  </nav>

  <div id="toast" class="hidden"></div>
  <div id="modal" class="hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p class="hint" id="modal-text"></p>
      <div class="actions" id="modal-actions"></div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
